<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fullbody</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C1613F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fullbody">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Тема задаёт только палитру: фон, линии и три акцента. Остальное общее. */
:root{
  --bg:#FBF8F4; --card:#FFF; --line:#EDE7E0; --ink:#2E2A26; --muted:#8C8378;
  --a1:#C1613F; --a2:#6F8050; --a3:#C08519; --input:#FFFBEE; --input-line:#E6CE95;
  --tint:12%; --r:14px;
}
[data-theme=indigo]{--bg:#F6F8FC; --card:#FFF; --line:#E5E9F2; --ink:#1B1F2A; --muted:#7C8394;
  --a1:#4F5BD5; --a2:#1F8A8A; --a3:#C2557A; --input:#F4F6FE; --input-line:#C3CBEC}
[data-theme=forest]{--bg:#F5F9F5; --card:#FFF; --line:#E1EBE1; --ink:#1A241C; --muted:#77857A;
  --a1:#2F7D5B; --a2:#7A8B3C; --a3:#B87333; --input:#F3FAF4; --input-line:#BCDCC4}
[data-theme=graphite]{--bg:#F7F7F8; --card:#FFF; --line:#E6E6EA; --ink:#1A1A1C; --muted:#82848C;
  --a1:#E2643B; --a2:#55585F; --a3:#8A8D95; --input:#F5F5F7; --input-line:#D2D3D9}
@media (prefers-color-scheme:dark){
  :root{--bg:#17150F; --card:#211E18; --line:#312C24; --ink:#F0EAE0; --muted:#9C938A;
    --a1:#E0805C; --a2:#9DB06F; --a3:#E7B04A; --input:#2A2519; --input-line:#4C4128; --tint:20%}
  [data-theme=indigo]{--bg:#0F1117; --card:#191C25; --line:#272B38; --ink:#E9ECF5; --muted:#8B92A4;
    --a1:#8B93F0; --a2:#4FC3C3; --a3:#E58AA8; --input:#1D2130; --input-line:#39405A}
  [data-theme=forest]{--bg:#0E120F; --card:#181F1A; --line:#26302A; --ink:#E6EDE7; --muted:#87958B;
    --a1:#6FC79A; --a2:#B3C46A; --a3:#D9944F; --input:#1A241D; --input-line:#33463A}
  [data-theme=graphite]{--bg:#121213; --card:#1C1C1E; --line:#2B2B2E; --ink:#EDEDEF; --muted:#8E9098;
    --a1:#FF7A4D; --a2:#9A9DA5; --a3:#6E7178; --input:#212124; --input-line:#3A3A3F}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
/* Непрозрачная полоса под статусбаром: иначе контент проезжает под часами */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);
  background:var(--bg);z-index:20}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
h1{font-size:26px;font-weight:600;margin:20px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.screen{display:none}.screen.on{display:block}

.navbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);
  padding:12px 10px;margin-bottom:14px;border:1px solid var(--line)}
.navbar button{flex:0 0 40px;height:40px;border:0;background:transparent;color:var(--muted);
  font-size:22px;border-radius:10px;cursor:pointer}
.navbar button:active{background:var(--bg)}
.navbar .mid{flex:1;text-align:center;min-width:0}
.navbar .mid b{display:block;font-size:17px;font-weight:600}
.navbar .mid span{display:block;font-size:12.5px;color:var(--muted)}

.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:0 0 16px}
.bar>i{display:block;height:100%;background:var(--a1);border-radius:5px;transition:width .25s}

.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px;border-left:4px solid var(--card)}
.ex.done{border-left-color:var(--a2);background:color-mix(in srgb,var(--a2) var(--tint),var(--card))}
.ex.low{border-left-color:var(--a1);background:color-mix(in srgb,var(--a1) var(--tint),var(--card))}
.ex .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex .nm{font-size:15.5px;font-weight:600;line-height:1.3}
.ex .mark{font-size:19px;line-height:1;flex:0 0 auto}
.ex.done .mark{color:var(--a2)}.ex.low .mark{color:var(--a1)}
.ex .meta{font-size:12.5px;color:var(--muted);margin:3px 0 11px}
.ex .warm{font-size:12px;color:var(--muted);margin:-7px 0 10px;opacity:.85}
.ex .top{cursor:pointer}
.ex .ic{font-size:13px;color:var(--muted);opacity:.7;font-weight:400}
.ex.open .ic{color:var(--a1);opacity:1}
.fld .up{font-size:13px;color:var(--a2);font-weight:600}


.toast{position:fixed;left:50%;transform:translate(-50%,20px);z-index:40;
  bottom:calc(84px + env(safe-area-inset-bottom));max-width:88%;
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;
  padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s}
.toast.on{opacity:.95;transform:translate(-50%,0)}

.gsec{padding:0}
.ghead{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:15px 16px;border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.gsec.open .ghead{color:var(--a1)}
.gsec .chev{display:inline-block;color:var(--muted);transition:transform .2s}
.gsec.open .chev{transform:rotate(90deg);color:var(--a1)}
.gbody{padding:0 16px 15px}
.gbody ul{margin:0;padding-left:17px}
.gbody li{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:9px}
.gbody li:last-child{margin-bottom:0}
.gsub{margin:18px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gnote{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;
  color:var(--muted);background:color-mix(in srgb,var(--a3) var(--tint),var(--card))}
.ex .plan{font-weight:600;color:var(--ink)}
.fields{display:flex;gap:9px}
.fld{flex:1;background:var(--input);border:1px solid var(--input-line);border-radius:11px;
  padding:6px 10px 7px}
.fld label{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em}
.fld input{width:100%;border:0;background:transparent;color:var(--ink);
  font-size:19px;font-weight:600;padding:0;outline:none;font-family:inherit}
.fld input::placeholder{color:var(--muted);font-weight:400;opacity:.45}
.fld.plan{background:transparent;border-style:dashed}
.fld .pv{font-size:19px;font-weight:600;color:var(--a1);line-height:1.45}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:flex-end}
.ov.on{display:flex}
.ov .sheet{background:var(--bg);width:100%;max-height:78vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.ov h3,.side h3{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;
  text-transform:uppercase;letter-spacing:.04em}
.ov .wk,.side .wk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ov .wk span,.side .wk span{flex:0 0 54px;font-size:12.5px;color:var(--muted)}
.ov .wk button,.side .wk button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ov .wk button.part,.side .wk button.part{border-color:var(--a3);color:var(--a3)}
.ov .wk button.full,.side .wk button.full{background:color-mix(in srgb,var(--a2) 18%,var(--card));
  border-color:var(--a2);color:var(--a2)}
.ov .wk button.cur,.side .wk button.cur{outline:2px solid var(--a1);outline-offset:1px;color:var(--ink)}

/* Широкий экран: обзор циклов живёт слева постоянной панелью */
.side,.side-open{display:none}
@media(min-width:1000px){
  .side{display:block;position:fixed;top:18px;bottom:18px;left:max(14px,calc(50% - 508px));
    width:230px;overflow:auto;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:14px;z-index:5}
  .side.off{display:none}
  .side h3:first-of-type{margin-top:10px}
  .side .wk span{flex-basis:50px;font-size:12px}
  .side .wk button{padding:8px 0;font-size:12.5px}
  .side-open.show{display:flex;position:fixed;top:18px;left:14px;z-index:5;
    width:42px;height:42px;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--muted);font-size:18px;cursor:pointer}
  .side .fold{border:0;background:transparent;color:var(--muted);font-size:18px;
    cursor:pointer;padding:4px 8px;border-radius:8px}
  .side .fold:active,.side-open.show:active{background:var(--bg)}
}

.more{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  margin-top:11px;padding:9px 0 0;border:0;border-top:1px solid var(--line);background:transparent;
  color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.more .chev{display:inline-block;transition:transform .2s}
.ex.open .more .chev{transform:rotate(90deg)}
.det{margin-top:10px;font-size:13px;color:var(--muted)}
.det ul{margin:0 0 10px;padding-left:17px}
.det li{margin-bottom:4px;line-height:1.35}
.det .tip{margin:0 0 10px;padding:9px 11px;border-radius:10px;line-height:1.35;color:var(--ink);
  background:color-mix(in srgb,var(--a3) var(--tint),var(--card))}
.det a{color:var(--a1);text-decoration:none;font-weight:600}

.tot{display:flex;gap:10px;margin:16px 0 4px}
.tot div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.tot span{display:block;font-size:12px;color:var(--muted)}
.tot b{display:block;font-size:21px;font-weight:600;margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;margin:0 0 12px}
.card p.hint{font-size:12.5px;color:var(--muted);margin:-8px 0 12px}

.dl-val{display:flex;align-items:baseline;justify-content:center;gap:3px;margin:4px 0 12px}
.dl-val b{font-size:42px;font-weight:600;color:var(--a1);line-height:1;letter-spacing:-.03em}
.dl-val span{font-size:20px;font-weight:600;color:var(--a1)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;
  background:var(--line);outline:none;margin:0;display:block}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;
  border-radius:50%;background:var(--a1);border:4px solid var(--card);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--a1);
  border:3px solid var(--card);cursor:pointer}
.dl-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:9px}

.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.themes button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px 7px;
  cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted)}
.themes button.on{border-color:var(--a1);color:var(--ink)}
.themes i{display:flex;gap:3px;justify-content:center;margin-bottom:6px}
.themes i b{width:11px;height:11px;border-radius:50%;display:block}

.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{flex:1;font-size:14.5px}
.row .val{font-size:13px;color:var(--muted);min-width:74px;text-align:right}
.row input{width:82px;background:var(--input);border:1px solid var(--input-line);border-radius:9px;
  padding:7px 9px;font-size:16px;font-weight:600;color:var(--ink);text-align:center;font-family:inherit}
.btn{display:block;width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:15px;font-weight:600;margin-top:9px;
  cursor:pointer;font-family:inherit}
.btn:active{background:var(--bg)}
.btn.warn{color:var(--a1);border-color:var(--a1)}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs button{flex:1;padding:11px 0 13px;border:0;background:transparent;color:var(--muted);
  font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tabs button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.tabs button.on{color:var(--a1)}
svg.chart{width:100%;height:190px;display:block}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px}
</style>
</head>
<body>
<div class="wrap">

<section id="s-work" class="screen on">
  <h1>Тренировка</h1>
  <p class="sub" id="w-sub">—</p>
  <div class="navbar">
    <button id="w-prev" aria-label="Предыдущая">‹</button>
    <div class="mid" id="w-mid" role="button" style="cursor:pointer">
      <b><span id="w-day">—</span> <span class="hintch" style="font-size:12px;color:var(--muted)">⌄</span></b>
      <span id="w-pos">—</span>
    </div>
    <button id="w-next" aria-label="Следующая">›</button>
  </div>
  <div class="bar"><i id="w-bar" style="width:0"></i></div>
  <div id="w-list"></div>
  <div class="tot">
    <div><span>Тоннаж</span><b id="w-tonnage">—</b></div>
    <div><span>Выполнено</span><b id="w-count">—</b></div>
    <div><span>Калории</span><b id="w-kcal">—</b></div>
  </div>
</section>

<section id="s-prog" class="screen">
  <h1>Прогресс</h1>
  <div class="tot" id="p-maxes"></div>
  <div class="card">
    <h2>Расчётный максимум</h2>
    <div id="p-chart"></div>
  </div>
  <div class="card">
    <h2>Тоннаж по циклам</h2>
    <div id="p-tonnage"></div>
  </div>
  <div class="card">
    <h2>Последние тренировки</h2>
    <div id="p-recent"></div>
  </div>
</section>

<section id="s-guide" class="screen">
  <h1>Гид</h1>
  <p class="sub" id="g-sub">—</p>
  <div id="g-list"></div>
</section>

<section id="s-set" class="screen">
  <h1>Настройки</h1>

  <div class="card">
    <h2>После перерыва</h2>
    <div class="dl-val"><b id="dl-num">0</b><span>%</span></div>
    <input type="range" id="dl-range" min="0" max="40" step="1" value="0" aria-label="Снижение весов">
    <div class="dl-scale"><span>0</span><span>20</span><span>40</span></div>
  </div>

  <div class="card">
    <h2>Оформление</h2>
    <div class="themes" id="st-themes"></div>
  </div>

  <div class="card">
    <h2>Профиль</h2>
    <div class="row"><div class="lab">Пол</div><div class="val"></div>
      <select id="pf-sex" style="width:82px;background:var(--input);border:1px solid var(--input-line);
        border-radius:9px;padding:7px 6px;font-size:15px;font-weight:600;color:var(--ink);font-family:inherit">
        <option value="м">муж</option><option value="ж">жен</option>
      </select></div>
    <div class="row"><div class="lab">Возраст</div><div class="val"></div>
      <input inputmode="numeric" id="pf-age" placeholder="—"></div>
    <div class="row"><div class="lab">Рост, см</div><div class="val"></div>
      <input inputmode="numeric" id="pf-h" placeholder="—"></div>
    <div class="row"><div class="lab">Вес тела, кг</div><div class="val"></div>
      <input inputmode="decimal" id="pf-w" placeholder="—"></div>
  </div>

  <div class="card">
    <h2>Мои максимумы</h2>
    <div id="st-maxes"></div>
  </div>

  <div class="card">
    <h2>Шаг веса в зале</h2>
    <div id="st-steps"></div>
  </div>

  <div class="card">
    <h2>Данные</h2>
    <button class="btn" id="st-export">Сохранить копию</button>
    <button class="btn" id="st-import">Загрузить копию</button>
    <button class="btn warn" id="st-reset">Стереть всю историю</button>
    <input type="file" id="st-file" accept=".json" hidden>
  </div>
</section>

</div>

<aside class="side" id="side">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
    <b style="font-size:15px;flex:1">Циклы</b>
    <button class="btn" id="side-now" style="width:auto;margin:0;padding:7px 12px;font-size:13px">К текущей</button>
    <button class="fold" id="side-fold" aria-label="Свернуть панель">«</button>
  </div>
  <div id="side-list"></div>
</aside>
<button class="side-open" id="side-open" aria-label="Развернуть панель циклов">»</button>

<div class="ov" id="ov">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:17px">Куда перейти</b>
      <button class="btn" id="ov-now" style="width:auto;margin:0;padding:8px 14px">К текущей</button>
    </div>
    <div id="ov-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="tabs">
  <button data-s="s-work" class="on"><i>▦</i>Тренировка</button>
  <button data-s="s-guide"><i>◈</i>Гид</button>
  <button data-s="s-prog"><i>◪</i>Прогресс</button>
  <button data-s="s-set"><i>⚙</i>Настройки</button>
</nav>

<script src="data.js?v=7"></script>
<script>
const KEY = 'fullbody.v1';
const THEMES = [
  {id: '',         name: 'Терракота', dots: ['#C1613F', '#6F8050', '#C08519']},
  {id: 'indigo',   name: 'Индиго',    dots: ['#4F5BD5', '#1F8A8A', '#C2557A']},
  {id: 'forest',   name: 'Лес',       dots: ['#2F7D5B', '#7A8B3C', '#B87333']},
  {id: 'graphite', name: 'Графит',    dots: ['#E2643B', '#55585F', '#8A8D95']},
];
// Функция, а не константа: иначе вложенные объекты делятся по ссылке
// между состояниями и записи утекают в шаблон.
const BLANK = () => ({maxes:{}, lastWeights:{}, deload:.20, steps:{}, log:{}, cur:null,
  theme:'', sideOpen:true, profile:{sex:'м', age:0, h:0, w:0}});
const load = () => {
  try { return Object.assign(BLANK(), JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch { return BLANK(); }
};
let S = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const applyTheme = () => {
  document.documentElement.dataset.theme = S.theme || '';
  const c = getComputedStyle(document.documentElement).getPropertyValue('--a1').trim();
  document.querySelector('meta[name=theme-color]').content = c || '#C1613F';
};
applyTheme();

const days = w => DAYS.filter(d => PROGRAM.some(p => p.w === w && p.d === d));
const items = (w, d) => PROGRAM.filter(p => p.w === w && p.d === d);
const slot = (c, w, d) => c + '|' + w + '|' + d;
const stepOf = n => S.steps[CATALOG[n].eq] ?? CATALOG[n].step;

// Brzycki, только до 12 повторов — выше оценка перестаёт быть осмысленной
const e1rm = (w, r) => (w > 0 && r > 0 && r <= 12) ? w * 36 / (37 - r) : 0;

function allSets(name) {
  const out = [];
  let i = 0;
  for (const k in S.log) {
    const e = S.log[k].sets?.[name];
    if (e && e.w > 0) out.push({...e, cycle: +k.split('|')[0], k, i});
    i++;
  }
  return out;
}
// Записи прошлых тренировок: текущая исключена, иначе план прыгал бы
// прямо во время ввода и тут же помечал только что сделанный подход как недобор.
const priorSets = name => {
  const cur = slot(S.cur.c, S.cur.w, S.cur.d);
  return allSets(name).filter(s => s.k !== cur);
};
function lastOf(sets) {
  if (!sets.length) return null;
  const withT = sets.filter(s => s.t);
  return (withT.length ? withT : sets).reduce((a, b) => ((b.t || b.i) > (a.t || a.i) ? b : a));
}
const bestE1RM = (name, cycle) => allSets(name)
  .filter(s => cycle === undefined || s.cycle === cycle)
  .reduce((m, s) => Math.max(m, e1rm(s.w, s.r)), 0);
const bestWeight = name => allSets(name).reduce((m, s) => Math.max(m, s.w), 0);
const effMax = name => Math.max(S.maxes[name] ?? 0, bestE1RM(name));

// Максимум для планирования — только по прошлым тренировкам
const planMax = name => Math.max(S.maxes[name] ?? 0,
  priorSets(name).reduce((m, s) => Math.max(m, e1rm(s.w, s.r)), 0));

// Подсобка: сделал все повторы на своём лучшем весе — в следующий раз шаг вверх
function accessoryBump(p) {
  const prior = priorSets(p.n);
  const best = prior.reduce((m, s) => Math.max(m, s.w), 0);
  if (!best) return false;
  const last = lastOf(prior);
  return !!(last && last.w >= best && last.r >= p.r);
}
function accessoryBase(p) {
  const best = priorSets(p.n).reduce((m, s) => Math.max(m, s.w), 0);
  const base = Math.max(best, S.lastWeights[p.n] ?? 0);
  return base && accessoryBump(p) ? base + stepOf(p.n) : base;
}

function plan(p) {
  const c = CATALOG[p.n], step = stepOf(p.n);
  const raw = p.pmin ? planMax(p.n) * p.pmin : accessoryBase(p);
  if (!raw) return 0;
  return Math.max(c.min, Math.round(raw * (1 - S.deload) / step) * step);
}

function firstUnfinished() {
  for (let c = 1; c <= 60; c++)
    for (let w = 1; w <= 4; w++)
      for (const d of days(w)) {
        const rec = S.log[slot(c, w, d)];
        const n = rec ? Object.values(rec.sets || {}).filter(x => x.w > 0).length : 0;
        if (n < items(w, d).length) return {c, w, d};
      }
  return {c: 1, w: 1, d: DAYS[0]};
}
if (!S.cur) S.cur = firstUnfinished();

function shift(dir) {
  const flat = [];
  for (let w = 1; w <= 4; w++) for (const d of days(w)) flat.push({w, d});
  let i = flat.findIndex(x => x.w === S.cur.w && x.d === S.cur.d);
  i += dir;
  let c = S.cur.c;
  if (i < 0) { if (c === 1) return; c--; i = flat.length - 1; }
  if (i >= flat.length) { c++; i = 0; }
  S.cur = {c, w: flat[i].w, d: flat[i].d};
  save(); renderWork();
}

function setVal(name, field, raw) {
  const k = slot(S.cur.c, S.cur.w, S.cur.d);
  S.log[k] = S.log[k] || {date: new Date().toISOString().slice(0, 10), sets: {}};
  const e = S.log[k].sets[name] = S.log[k].sets[name] || {w: 0, r: 0};
  e[field] = parseFloat(String(raw).replace(',', '.')) || 0;
  // Время первого ввода — по нему считается реальная длительность тренировки
  if ((e.w || e.r) && !e.t) e.t = Date.now();
  if (!e.w && !e.r) delete S.log[k].sets[name];
  save();
}

const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
const pct = v => Math.round(v * 100) + '%';

// Отдых зависит от того, силовая это работа или объёмная.
// Вторым числом — середина диапазона в минутах, для оценки калорий.
function restInfo(p) {
  if (CATALOG[p.n].grp === 'Пресс') return ['45–60 сек', .9];
  if (p.pmin) {
    if (p.r <= 4) return ['4–5 мин', 4.5];
    if (p.r <= 6) return ['3–4 мин', 3.5];
    if (p.r <= 8) return ['2–3 мин', 2.5];
    return ['90 сек – 2 мин', 1.75];
  }
  return p.r <= 8 ? ['90 сек – 2 мин', 1.75] : ['60–90 сек', 1.25];
}
const restOf = p => restInfo(p)[0];

// Оценка калорий по MET: тяжёлая база 6, свой вес 5, изоляция 4, пресс 3.
// Поправка Byrne 2005: ккал/мин покоя берётся из личного БО, а не «средних» 3.5 мл/кг.
// EPOC — дожиг после силовой, +7% к итогу.
const EPOC = 1.07;
const metOf = p => {
  const c = CATALOG[p.n];
  return p.pmin ? 6 : (c.grp === 'Пресс' ? 3 : (c.eq === 'Свой вес' ? 5 : 4));
};
const exMins = p => p.s * (.7 + restInfo(p)[1]);
function restRate() {              // ккал в минуту в покое
  const b = bmr();
  if (b) return b / 1440;
  const bw = S.profile?.w;
  return bw ? 3.5 * bw / 200 : 0;
}
function kcalEx(p) {
  const rate = restRate();
  return rate ? Math.round(metOf(p) * rate * exMins(p) * EPOC / 5) * 5 : 0;
}
// Итог за тренировку: если записи шли по ходу занятия, берём реальную
// длительность (первый ввод → последний), иначе сумму модельных оценок.
function kcalWorkout(list, rec) {
  const rate = restRate();
  if (!rate) return 0;
  const done = list.filter(p => rec.sets[p.n]?.w > 0);
  if (!done.length) return 0;
  const model = done.reduce((s, p) => s + kcalEx(p), 0);
  const ts = done.map(p => rec.sets[p.n].t).filter(Boolean);
  if (ts.length < 2) return model;
  const span = Math.min((Math.max(...ts) - Math.min(...ts)) / 60000, 180);
  if (span < 15) return model;
  const wsum = done.reduce((s, p) => s + exMins(p), 0);
  const avgMet = done.reduce((s, p) => s + metOf(p) * exMins(p), 0) / wsum;
  return Math.round(avgMet * rate * span * EPOC / 5) * 5;
}
function bmr() {
  const {sex, age, h, w} = S.profile || {};
  if (!age || !h || !w) return 0;
  return Math.round(10 * w + 6.25 * h - 5 * age + (sex === 'ж' ? -161 : 5));
}
const openInfo = new Set();
let warmOpen = false;

}

}
// Разминка Саида, как он её делает: общее → суставы → уязвимые зоны → лёгкая нагрузка
const WARM = [
  'Дорожка, спокойный шаг — 7–10 мин',
  'Суставная сверху вниз: шея, плечи, локти, кисти, таз, колени, голеностопы',
  'Мобилизация тазобедренного сустава',
  'Наклоны вперёд на бицепс бедра — удержание до 30 сек',
  'Резинка: плечевой пояс и ротаторная манжета',
  '',
  'Leg extension лёгкий — 2–3 подхода, разбудить колени',
];
function warmList(list) {
  const out = WARM.slice();
  // Перед тягой поясницу заранее не утомляем
  out[5] = list.some(p => p.n === 'Становая тяга')
    ? 'Гиперэкстензия 1 × 12–15 без веса — сегодня тяга, поясницу береги'
    : 'Гиперэкстензия 2 × 20';
  return out;
}

// Подводящие подходы: штанга с процентами — полная лесенка, прочее железо — один лёгкий
function warmupSets(p, pl) {
  const c = CATALOG[p.n];
  if (!pl || c.grp === 'Пресс' || c.eq === 'Свой вес') return '';
  const step = stepOf(p.n);
  const rnd = v => Math.max(c.min, Math.round(v / step) * step);
  if (p.pmin && c.eq === 'Штанга') {
    const bar = c.min || 20, steps = [];
    if (pl > bar * 2) steps.push([bar, 10]);
    for (const [f, r] of [[.5, 5], [.7, 3], [.85, 1]]) {
      const w = rnd(pl * f);
      if (w > bar && w < pl - step / 2 && (!steps.length || w > steps[steps.length - 1][0]))
        steps.push([w, r]);
    }
    return steps.length ? 'Подводка: ' + steps.map(s => fmt(s[0]) + ' × ' + s[1]).join(' → ') : '';
  }
  const w = rnd(pl * .55);
  return w < pl ? 'Разминка: ' + fmt(w) + ' × 10' : '';
}

function detail(p) {
  const inf = INFO[p.n] || {cues: [], tip: ''};
  // Прямая ссылка на проверенный ролик; поиск — только если ролика нет
  const href = inf.video || 'https://www.youtube.com/results?search_query=' +
    encodeURIComponent(p.n + ' техника выполнения');
  return '<div class="det">' +
    '<ul>' + inf.cues.map(c => '<li>' + c + '</li>').join('') + '</ul>' +
    (inf.tip ? '<p class="tip">' + inf.tip + '</p>' : '') +
    '<a href="' + href + '" target="_blank" rel="noopener">' +
    (inf.video ? 'Видео: техника выполнения ↗' : 'Найти видео ↗') + '</a></div>';
}

function renderWork() {
  const {c, w, d} = S.cur, list = items(w, d), rec = S.log[slot(c, w, d)] || {sets: {}};
  document.getElementById('w-sub').textContent = 'Цикл ' + c + ' · неделя ' + w;
  document.getElementById('w-day').textContent = d;
  const di = days(w).indexOf(d) + 1;
  document.getElementById('w-pos').textContent = 'тренировка ' + di + ' из ' + days(w).length +
    (S.deload ? ' · веса −' + pct(S.deload) : '');

  let done = 0, tonnage = 0, html = '';
  html += '<div class="ex' + (warmOpen ? ' open' : '') + '">' +
    '<button class="more" id="warm-t" style="margin:0;padding:0;border:0">Разминка перед тренировкой · 20–25 мин' +
    '<span class="chev">›</span></button>' +
    (warmOpen ? '<div class="det"><ul style="margin-bottom:0">' +
      warmList(list).map(x => '<li>' + x + '</li>').join('') + '</ul></div>' : '') +
    '</div>';
  for (const p of list) {
    const pl = plan(p), e = rec.sets[p.n] || {};
    const filled = e.w > 0;
    if (filled) { done++; tonnage += p.s * (e.r || 0) * e.w; }
    const open = openInfo.has(p.n);
    const cls = (!filled ? '' : (pl && e.w < pl ? ' low' : ' done')) + (open ? ' open' : '');
    const mark = !filled ? '' : (pl && e.w < pl ? '↓' : '✓');
    const meta = p.s + ' × ' + p.r +
      (p.pmin ? ' · ' + pct(p.pmin) + '–' + pct(p.pmax) : '') +
      ' · отдых ' + restOf(p);
    // Подводка нужна только до первого рабочего подхода
    const ws = filled ? '' : warmupSets(p, pl);
    const bump = pl && !p.pmin && accessoryBump(p) ? ' <span class="up">↑</span>' : '';
    html += '<div class="ex' + cls + '">' +
      '<div class="top" data-i="' + p.n + '"><div class="nm">' + p.n +
        ' <span class="ic">ⓘ</span></div><div class="mark">' + mark + '</div></div>' +
      '<div class="meta">' + meta + '</div>' +
      (ws ? '<div class="warm">' + ws + '</div>' : '') +
      '<div class="fields">' +
      '<div class="fld plan"><label>план, кг</label><div class="pv">' + (pl ? fmt(pl) : '—') + bump + '</div></div>' +
      '<div class="fld"><label>вес, кг</label><input inputmode="decimal" placeholder="' +
        (pl ? fmt(pl) : '—') + '" value="' + (e.w || '') + '" data-n="' + p.n + '" data-f="w"></div>' +
      '<div class="fld"><label>повторы</label><input inputmode="numeric" placeholder="' + p.r +
        '" value="' + (e.r || '') + '" data-n="' + p.n + '" data-f="r"></div>' +
      '</div>' +
      (open ? detail(p) : '') +
      '</div>';
  }
  document.getElementById('w-list').innerHTML = html;
  document.getElementById('w-bar').style.width = (list.length ? done / list.length * 100 : 0) + '%';
  document.getElementById('w-tonnage').textContent = tonnage ? Math.round(tonnage).toLocaleString('ru-RU') + ' кг' : '—';
  document.getElementById('w-count').textContent = done + ' / ' + list.length;
  const kcAll = list.reduce((s, p) => s + kcalEx(p), 0);
  const kcDone = kcalWorkout(list, rec);
  document.getElementById('w-kcal').textContent = !kcAll ? '—'
    : (kcDone ? '≈' + kcDone : 'до ≈' + kcAll);

  for (const inp of document.querySelectorAll('#w-list input')) {
    inp.addEventListener('change', ev => {
      setVal(ev.target.dataset.n, ev.target.dataset.f, ev.target.value);
      renderWork();
    });
  }
  for (const t of document.querySelectorAll('#w-list .top[data-i]')) {
    t.onclick = () => {
      const k = t.dataset.i;
      openInfo.has(k) ? openInfo.delete(k) : openInfo.add(k);
      renderWork();
    };
  }
  document.getElementById('warm-t').onclick = () => { warmOpen = !warmOpen; renderWork(); };
  renderSide();
}

function bars(rows, unit) {
  if (!rows.length) return '<div class="empty">Пока нет записей</div>';
  const mx = Math.max(...rows.map(r => r.v));
  return rows.map(r => '<div class="row"><div class="lab">Цикл ' + r.k + '</div>' +
    '<div style="flex:2;height:8px;background:var(--line);border-radius:8px;overflow:hidden">' +
    '<i style="display:block;height:100%;width:' + (mx ? r.v / mx * 100 : 0) + '%;background:var(--a3)"></i></div>' +
    '<div class="val">' + Math.round(r.v).toLocaleString('ru-RU') + ' ' + unit + '</div></div>').join('');
}

function lineChart(series) {
  const cycles = [...new Set(Object.keys(S.log).map(k => +k.split('|')[0]))].sort((a, b) => a - b);
  const all = series.flatMap(s => s.pts.map(p => p.v)).filter(v => v > 0);
  if (!cycles.length || !all.length) return '<div class="empty">Появится после первой записи</div>';
  const W = 480, H = 190, pad = 30;
  const lo = Math.min(...all) * .93, hi = Math.max(...all) * 1.05;
  const x = i => pad + (cycles.length > 1 ? i / (cycles.length - 1) : .5) * (W - pad * 2);
  const y = v => H - pad - (v - lo) / (hi - lo || 1) * (H - pad * 2);
  let out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  out += '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) +
    '" stroke="var(--line)" stroke-width="1.5"/>';
  for (const s of series) {
    const pts = s.pts.map((p, i) => p.v > 0 ? [x(i), y(p.v)] : null).filter(Boolean);
    if (!pts.length) continue;
    if (pts.length > 1)
      out += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-linejoin="round" points="' +
        pts.map(p => p.join(',')).join(' ') + '"/>';
    out += pts.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + s.color + '"/>').join('');
  }
  out += '</svg><div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px">' +
    series.map(s => '<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' +
      s.color + ';margin-right:5px"></i>' + s.label + '</span>').join('') + '</div>';
  return out;
}

function renderProg() {
  document.getElementById('p-maxes').innerHTML = BASE_LIFTS.map(n =>
    '<div><span>' + n.split(' ')[0] + '</span><b>' + (effMax(n) ? fmt(Math.round(effMax(n) * 10) / 10) : '—') + '</b></div>').join('');

  const cycles = [...new Set(Object.keys(S.log).map(k => +k.split('|')[0]))].sort((a, b) => a - b);
  const colors = ['var(--a1)', 'var(--a2)', 'var(--a3)'];
  document.getElementById('p-chart').innerHTML = lineChart(BASE_LIFTS.map((n, i) => ({
    label: n.split(' ').slice(0, 2).join(' '), color: colors[i],
    pts: cycles.map(c => ({k: c, v: Math.round(bestE1RM(n, c) * 10) / 10}))
  })));

  const tn = cycles.map(c => {
    let t = 0;
    for (const k in S.log) {
      if (+k.split('|')[0] !== c) continue;
      const [, w, d] = k.split('|');
      for (const p of items(+w, d)) {
        const e = S.log[k].sets?.[p.n];
        if (e && e.w > 0) t += p.s * (e.r || 0) * e.w;
      }
    }
    return {k: c, v: t};
  }).filter(r => r.v > 0);
  document.getElementById('p-tonnage').innerHTML = bars(tn, 'кг');

  const recent = Object.entries(S.log)
    .map(([k, v]) => ({k, v, n: Object.values(v.sets || {}).filter(x => x.w > 0).length}))
    .filter(r => r.n).sort((a, b) => (b.v.date || '').localeCompare(a.v.date || '')).slice(0, 8);
  document.getElementById('p-recent').innerHTML = recent.length ? recent.map(r => {
    const [c, w, d] = r.k.split('|');
    return '<div class="row"><div class="lab">' + d + '<br><span style="font-size:12px;color:var(--muted)">Цикл ' +
      c + ' · неделя ' + w + '</span></div><div class="val">' +
      (r.v.date ? r.v.date.split('-').reverse().slice(0, 2).join('.') : '') + '<br>' + r.n + ' упр.</div></div>';
  }).join('') : '<div class="empty">Пока нет записей</div>';
}

        n + Object.values(v.sets || {}).filter(x => x.w > 0).length, 0);
      if (have && !confirm('Сейчас в журнале записей: ' + have +
          '. Загрузка заменит их (в файле: ' + bring + '). Продолжить?')) return;
      S = Object.assign(BLANK(), data);
      if (!S.cur) S.cur = firstUnfinished();
      save(); applyTheme(); renderWork(); renderProg(); renderSet();
      alert('Копия загружена');
    } catch { alert('Не получилось прочитать файл'); }
    finally { ev.target.value = ''; }
  };
  r.readAsText(f);
};
document.getElementById('st-reset').onclick = () => {
  if (!confirm('Стереть всю историю тренировок? Максимумы и настройки останутся. Это не отменить.')) return;
  S.log = {};
  S.cur = firstUnfinished();
  save(); renderWork(); renderProg(); renderSet();
};

// Обзор: сетка цикл → неделя → день, прыжок одним нажатием
const DAY_SHORT = {'Понедельник': 'Пн', 'Среда': 'Ср', 'Пятница': 'Пт'};
function dayState(c, w, d) {
  const rec = S.log[slot(c, w, d)], total = items(w, d).length;
  const n = rec ? Object.values(rec.sets || {}).filter(x => x.w > 0).length : 0;
  return n === 0 ? '' : (n >= total ? 'full' : 'part');
}
function overviewHTML() {
  const logged = Object.keys(S.log).map(k => +k.split('|')[0]);
  const maxC = Math.max(S.cur.c + 1, logged.length ? Math.max(...logged) + 1 : 0, 2);
  let h = '';
  for (let c = 1; c <= maxC; c++) {
    h += '<h3>Цикл ' + c + '</h3>';
    for (let w = 1; w <= 4; w++) {
      h += '<div class="wk"><span>Неделя ' + w + '</span>' + days(w).map(d => {
        const cur = S.cur.c === c && S.cur.w === w && S.cur.d === d;
        return '<button class="' + dayState(c, w, d) + (cur ? ' cur' : '') +
          '" data-j="' + c + '|' + w + '|' + d + '">' + DAY_SHORT[d] + '</button>';
      }).join('') + '</div>';
    }
  }
  return h;
}
function jumpTo(key) {
  const [c, w, d] = key.split('|');
  S.cur = {c: +c, w: +w, d};
  save(); renderWork(); closeOverview();
  showScreen('s-work');
}
function fillOverview(listId) {
  const el = document.getElementById(listId);
  el.innerHTML = overviewHTML();
  for (const b of el.querySelectorAll('button')) b.onclick = () => jumpTo(b.dataset.j);
}
function renderOverview() {
  fillOverview('ov-list');
  document.querySelector('#ov .cur')?.scrollIntoView({block: 'center'});
}
function renderSide() { fillOverview('side-list'); }
const ovEl = document.getElementById('ov');
function openOverview() { renderOverview(); ovEl.classList.add('on'); }
function closeOverview() { ovEl.classList.remove('on'); }
document.getElementById('w-mid').onclick = () => {
  // На широком экране обзор и так слева — шторка не нужна
  if (getComputedStyle(document.getElementById('side')).display === 'none') openOverview();
};
ovEl.onclick = ev => { if (ev.target === ovEl) closeOverview(); };
const goNow = () => {
  S.cur = firstUnfinished();
  save(); renderWork(); closeOverview();
  showScreen('s-work');
};
document.getElementById('ov-now').onclick = goNow;
document.getElementById('side-now').onclick = goNow;

// Сворачивание боковой панели; состояние переживает перезапуск
function applySide() {
  document.getElementById('side').classList.toggle('off', !S.sideOpen);
  document.getElementById('side-open').classList.toggle('show', !S.sideOpen);
}
document.getElementById('side-fold').onclick = () => { S.sideOpen = false; save(); applySide(); };
document.getElementById('side-open').onclick = () => { S.sideOpen = true; save(); applySide(); };
applySide();

document.getElementById('w-prev').onclick = () => shift(-1);
document.getElementById('w-next').onclick = () => shift(1);
// Гид: подстраивается под сегодняшнюю тренировку
const openGuide = new Set(['warm']);
const GROUP_STRETCH = {
  'Ноги': 'квадрицепс и бицепс бедра', 'Спина': 'широчайшие и поясницу',
  'Грудь': 'грудные в дверном проёме', 'Плечи': 'дельты и грудной отдел',
  'Бицепс': 'бицепс у стены', 'Трицепс': 'трицепс за головой', 'Пресс': 'пресс прогибом лёжа',
};
const GROUP_WARM = {
  'Ноги': 'тазу и коленям',
  'Плечи': 'плечевому поясу, сегодня много работы над головой',
  'Грудь': 'плечевому поясу и манжете, жимы любят разогретое плечо',
  'Спина': 'пояснице и лопаткам',
};
// Склонение существительного при числе: 1 подход, 2 подхода, 5 подходов
const plural = (n, one, few, many) => {
  const a = Math.abs(n)% 100, b = a% 10;
  return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many);
};
// Следующая тренировка по порядку недель и дней
function nextSlot() {
  const flat = [];
  for (let ww = 1; ww <= 4; ww++) for (const dd of days(ww)) flat.push({w: ww, d: dd});
  let i = flat.findIndex(x => x.w === S.cur.w && x.d === S.cur.d) + 1;
  return i >= flat.length ? {c: S.cur.c + 1, ...flat[0]} : {c: S.cur.c, ...flat[i]};
}

function guideSections() {
  const {c, w, d} = S.cur, list = items(w, d);
  const based = list.filter(p => p.pmin);
  const heavy = based.slice().sort((a, b) => b.pmin - a.pmin)[0];
  const top = heavy ? heavy.pmin : 0;
  const dl = list.some(p => p.n === 'Становая тяга');
  const sq = list.some(p => p.n === 'Приседания со штангой');
  const grps = [...new Set(list.map(p => CATALOG[p.n].grp))];
  const sets = list.reduce((s, p) => s + p.s, 0);
  const mins = Math.round(list.reduce((s, p) => s + exMins(p), 0) / 5) * 5;

  const warm = warmList(list);
  const acc = grps.map(g => GROUP_WARM[g]).filter(Boolean)[0];
  if (acc) warm.push('Сегодня работают ' + grps.join(', ').toLowerCase() + ' — особое внимание ' + acc + '.');

  const warmExtra = [
    'Разогрев добавляет не максимум, а скорость и контроль. Общая разминка вместе со специальной даёт в разовом максимуме примерно на 8% больше, чем одна специальная.',
    'Разминка — это ещё и замер. Подводящие идут заметно медленнее обычного — сегодня ты слабее: если 70% идут со скоростью привычных 85%, это минус около 18%, верхняя граница дневных колебаний. Пересчитывай проценты, подходы и повторы оставляй по плану.',
    'Утром сила ниже на 10–13% на крупных группах, пик приходится на 16–20 часов. Разминка на 15 минут вместо пяти срезает разницу примерно вдвое. И не ставь присед в первый час после подъёма: за ночь диски набирают воду, наклон в это время грузит их заметно сильнее.',
  ];
  if (S.deload >= .1)
    warmExtra.push('Сухожилия отстают от мышц. Сила и нервная система возвращаются за недели, жёсткость сухожилия — за два-три месяца. Мышцы вытянут прошлогодний вес раньше, чем к нему будут готовы точки крепления: ноющий локоть или колено на третьей неделе — как раз отсюда.');

  const during = [
    'Сегодня ' + plural(list.length, 'упражнение', 'упражнения', 'упражнений') + ' и ' +
      plural(sets, 'рабочий подход', 'рабочих подхода', 'рабочих подходов') +
      ', это примерно ' + plural(mins, 'минута', 'минуты', 'минут') + ' вместе с отдыхом.',
    top >= .8 ? 'Самый тяжёлый день недели: ' + pct(top) + ' от максимума. Запас — один повтор, не больше.'
      : top >= .7 ? 'День средней тяжести: ' + pct(top) + ' от максимума. Оставляй два повтора в запасе.'
      : top ? 'Лёгкий по весу день: ' + pct(top) + ' от максимума. Запас три-четыре повтора; десять в запасе — это уже не тренировка, а затянутая разминка.'
      : 'Сегодня работы по процентам нет — ориентируйся на свои прошлые веса.',
    heavy ? 'Главное сегодня — ' + heavy.n.toLowerCase() + ', ' + heavy.s + ' × ' + heavy.r +
      '. Отдых ' + restOf(heavy) + ': к третьей минуте креатинфосфат восстановлен процентов на 85, за 90% выходит только к пятой. Полторы минуты на тяжёлом весе стоят одного-двух повторов в следующем подходе.' : '',
    'Подход заканчивается при потере скорости на 20–25% от первого повтора, а не при жжении. На пятёрках в 80% закисление вообще ничего не сообщает.',
    'Ощущение врёт в одну сторону: остаток повторов недооценивают в среднем на один, на средних весах — на два. Подход обычно бросают раньше запланированного запаса, а не позже.',
    'План не идёт — режь вес, а не подходы. Повтор на штанге стоит 2–3% максимума: промах на втором рабочем — минус 5% и добери остаток, промах на первом — минус 7–10% на всё движение.',
  ].filter(Boolean);
  if (top >= .8)
    during.push('Вдох глубокий, но не до предела: раздутая грудная клетка уводит рёбра и рушит жёсткость корпуса. Давление по кругу, в пояс и в бока — выпяченный вперёд живот даёт то же усилие без жёсткой стенки. Не выходит перевдохнуть без потери жёсткости — подход закончился, сколько бы повторов ни оставалось.');
  if (dl)
    during.push('Сегодня тяга: как только поясница начала скругляться, подход окончен — даже если повторы ещё остались.');

  const after = [
    'Заминка не ускоряет восстановление и не убирает крепатуру. Пять минут лёгкой работы после тяжёлого приседа оставляют по другой причине: резкая остановка гонит кровь в ноги.',
    'Потяни то, что сегодня работало: ' + grps.map(g => GROUP_STRETCH[g]).filter(Boolean).join(', ') +
      '. На крепатуру это не влияет, разница на уровне погрешности. Смысл в амплитуде, и её даёт регулярная работа, а не пара минут после подходов.',
    'Белок 1,6–2,2 г на кг в сутки: 1,6 — точка, после которой прибавка сухой массы перестаёт расти. По приёмам ориентир 0,4 г на кг, при 90 кг это 36 граммов, четырёх приёмов на норму хватает.',
    'Восстановление задаёт не процент, а близость к отказу. 80% с потерей скорости 20% возвращаются к 48 часам, а 60% до отказа не возвращаются и за двое суток. Лёгкий вес с длинными подходами восстанавливается дольше тяжёлого с короткими.',
  ];
  if (sq || dl)
    after.push('После тяжёлой работы на ноги и спину не планируй на вечер дела, где нужна поясница.');

  const nx = nextSlot(), nxList = items(nx.w, nx.d);
  const nxHeavy = nxList.filter(p => p.pmin).sort((a, b) => b.pmin - a.pmin)[0];
  const recovery = [
    'Следующая тренировка — в ' + (nx.d === 'Среда' ? 'среду' : nx.d === 'Пятница' ? 'пятницу' : 'понедельник') +
      ', неделя ' + nx.w + (nx.c !== c ? ' нового цикла' : '') +
      (nxHeavy ? ', главным будет ' + nxHeavy.n.toLowerCase() + ' на ' + pct(nxHeavy.pmin) + '.' : '.'),
    'Недовосстановление считается, а не ощущается. Пульс покоя утром выше обычного на 5–10 ударов три дня подряд; хват слабее процентов на десять; разминочный вес идёт медленнее обычного на 10% и больше — последний маркер честнее двух первых. Один — шум. Два из трёх — тяжёлая сессия сегодня заберёт не день, а неделю-две.',
    'Разгрузка режет объём, а не вес: два рабочих подхода вместо четырёх на тех же 75–80%. Ронять веса до 50–60% незачем, усталость копит тоннаж, а результат держит интенсивность. Если последние три недели ты заканчивал подходы за три-четыре повтора до отказа, разгружать нечего — и вопрос тогда не к восстановлению, а к тому, растут ли рабочие веса.',
    'Мышечная боль симметричная, сидит в брюшке, приходит через 12–24 часа и отпускает после разминки. Сухожильная — точечная, у прикрепления, на разминке уходит, а возвращается к рабочим подходам и наутро. Боль, которая к третьему подходу меньше и не даёт отката назавтра, — рабочая. Та, что растёт от подхода к подходу, стоит не трёх дней, а трёх месяцев.',
    'Острую узнаешь по тому, что можешь назвать конкретный повтор, на котором она случилась. Дальше по падению силы в этом движении: меньше 20% — пара дней, 20–50% — до недели, больше 50% — дольше.',
  ];
  recovery.push(S.deload >= .1
    ? 'Сейчас стоит снижение ' + pct(S.deload) + '. Прежние веса после месяца-двух простоя выходят за три-шесть недель, но сила и соединительная ткань идут вразнобой: уже на третьей-четвёртой неделе ты поднимешь то, к чему сухожилия ещё не готовы. Месяц в коридоре 60–85% — это минимум, а не полный срок их перестройки.'
    : 'Потери за перерыв: до двух недель почти ничего, 0–5%. Месяц — 5–10%, два месяца — 10–15%. Возвращается быстрее, чем набиралось: после месяца-двух простоя прежние веса обычно выходят за три-шесть недель.');

  return [
    {id: 'warm', t: 'Перед тренировкой', items: warm, extra: warmExtra,
     note: 'Порядок здесь не случайный: сначала разогреться целиком, потом раскрыть суставы, потом размять то, что обычно мешает работать — таз, заднюю поверхность бедра, плечи. Лёгкая нагрузка идёт последней.'},
    {id: 'during', t: 'Во время', items: during},
    {id: 'after', t: 'После тренировки', items: after},
    {id: 'rec', t: 'Восстановление и возвращение', items: recovery},
  ];
}

function renderGuide() {
  const {c, w, d} = S.cur;
  document.getElementById('g-sub').textContent = 'Под сегодняшнюю тренировку · цикл ' + c + ' · неделя ' + w + ' · ' + d.toLowerCase();
  document.getElementById('g-list').innerHTML = guideSections().map(s => {
    const on = openGuide.has(s.id);
    return '<div class="card gsec' + (on ? ' open' : '') + '">' +
      '<button class="ghead" data-g="' + s.id + '">' + s.t + '<span class="chev">›</span></button>' +
      (on ? '<div class="gbody"><ul>' + s.items.map(x => '<li>' + x + '</li>').join('') + '</ul>' +
        (s.note ? '<p class="gnote">' + s.note + '</p>' : '') +
        (s.extra ? '<p class="gsub">Что стоит знать</p><ul>' +
          s.extra.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') + '</div>' : '') +
      '</div>';
  }).join('');
  for (const b of document.querySelectorAll('#g-list .ghead'))
    b.onclick = () => {
      const k = b.dataset.g;
      openGuide.has(k) ? openGuide.delete(k) : openGuide.add(k);
      renderGuide();
    };
}

function showScreen(id) {
  for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x.dataset.s === id);
  for (const sc of document.querySelectorAll('.screen')) sc.classList.toggle('on', sc.id === id);
  if (id === 's-prog') renderProg();
  if (id === 's-guide') renderGuide();
  if (id === 's-set') renderSet();
  scrollTo(0, 0);
}
for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => showScreen(b.dataset.s);

renderWork();
renderSet();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
